# All dimensions and GPIO choices are UNVERIFIED placeholders.
schema_version: 1
machine:
  model: LumaCut CNC
  board: BTT SKR Mini MZ V1.0
  microcontroller: STM32F103RC
  work_area_mm: {x: null, y: null, z: null}
motors:
  x: {count: 1, connector: XM}
  y: {count: 1, connector: YM}
  z: {count: 1, connector: ZAM_or_ZBM}
  extruder_driver_used: false
homing:
  automatic_xyz_enabled: true
  x_switch_present: true
  x_endstop_pin: PC0
  y_switch_present: true
  y_endstop_pin: PC1
  z_switch_present: true
  z_endstop_pin: PC2
  z_shared_with_workpiece_probe: true
  x_y_reference_method: one_limit_switch_per_axis
  homing_direction_verified: false # adjust $23 to installed switch direction
probe:
  type: same_mechanical_switch_as_z_endstop
  shared_z_switch_count: 1
  total_axis_endstop_count: 3
  physical_signal_pin: PC2
  pc14_probe_input_wired: false
  grblhal_shared_pin_mode_implemented: false
  probing_enabled_in_firmware: false
  normally_closed_preferred: true
  x_offset_from_laser_mm: null
  y_offset_from_laser_mm: null
  trigger_tip_distance_from_optical_datum_mm: null
  probe_feed_mm_min: null
  max_probe_travel_mm: null
focus:
  target_optical_clearance_mm: 7.0
  homing_retract_mm: 7.0
  switch_trigger_optical_clearance_mm: 0.0 # placeholder; MUST calibrate
  auto_homing_retract_enabled: true
  profile_version: 2
  retract_travel_verified: false
workpiece_contact:
  implementation: grblhal_single_axis_z_homing
  command: "$HZ"
  grblhal_homing_mask_required: 3 # $22=3 enables single-axis homing
  physical_input: PC2
  switch_must_contact_material: true
  hmi_opt_in_required: true
  grbl_g38_probe_supported: false
  machine_z_origin_changes: true
  independent_probe_max_travel_limit: false
steppers:
  homing_holding_grbl_setting: "$1=255"
  hand_release_grbl_setting: "$1=0"
  release_invalidates_hmi_homed_reference: true
  is_physical_brake: false
hmi:
  touch_keyboard: full_screen_modal_click
  touch_to_move: laser_off_G53_XY_only_after_homing
  parameter_catalog: grbl_readback_plus_raw_editor
mesh:
  enabled: false
  realtime_z_compensation: false
  max_slope: null
laser:
  pwm_pin_candidate: PA1
  pwm_electrically_verified: false
  power_interlock_hardware_verified: false
  startup_state: off
safety:
  independent_estop: required
  enclosure_interlock: required
  key_enable: required
  extraction_feedback: recommended
  fire_detection: planned
screen:
  board: Waveshare ESP32-S3-Touch-LCD-7 Rev1.2
  candidate_transport: TTL_UART_after_level_verification
  serial_arbitration: pending
extensions:
  movement_sensor: reserved
  camera_alignment: planned
  automatic_material_detection: research_only
