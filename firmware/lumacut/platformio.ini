; LumaCut CNC firmware for BTT SKR Mini MZ V1.0 (STM32F103RET6).
[platformio]
default_envs = skr_mini_mz
src_dir = src

[env:skr_mini_mz]
platform = ststm32@15.4.1
platform_packages =
  platformio/framework-libopencm3@1.10000.260625
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = genericSTM32F103RE
framework = libopencm3
board_build.ldscript = lumacut.ld
build_unflags = -Os
build_flags =
  -O2
  -std=c11
  -g
build_src_flags = -Wall -Wextra -Wshadow -Wdouble-promotion -Wundef -Werror
