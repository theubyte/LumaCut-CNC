; Waveshare ESP32-S3-Touch-LCD-7 Rev1.2, 800x480 RGB / GT911 / CH422G
; Build via "pio run -e lumacut_waveshare_s3"
[env:lumacut_waveshare_s3]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:stamp.py
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
  -D BOARD_HAS_PSRAM
  -D LV_CONF_INCLUDE_SIMPLE
  -I src
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  lvgl/lvgl@8.3.11

; Opt-in bench firmware: sends grblHAL keypad commands over 3.3V UART.
; Not hardware-validated; use only with laser disconnected and safe travel.
[env:lumacut_waveshare_s3_keypad]
extends = env:lumacut_waveshare_s3
build_flags =
  ${env:lumacut_waveshare_s3.build_flags}
  -D HMI_UART_ENABLED=1

; LumaCut Control OS: LightBurn USB CDC, GRBL Wi-Fi/TCP, mobile jobs and macros.
; Requires matching UART-primary SKR firmware and physical interlock verification.
[env:lumacut_waveshare_s3_pro]
extends = env:lumacut_waveshare_s3
board_build.filesystem = littlefs
build_flags =
  ${env:lumacut_waveshare_s3.build_flags}
  -D HMI_PRO_ENABLED=1
