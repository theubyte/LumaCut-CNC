; LumaCut Bedienpanel: Waveshare ESP32-S3-Touch-LCD-7 (800x480, GT911, N16R8)
; Bauen:   python -m platformio run
; Flashen: python -m platformio run -t upload   (USB-C-Buchse "USB", nur mit dem Besitzer)
[env:panel]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
