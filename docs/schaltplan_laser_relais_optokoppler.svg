<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" font-family="Arial, Helvetica, sans-serif">
<rect width="1400" height="1120" fill="#ffffff"/>
<g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">

<!-- ===== Teil A: Laserversorgung ===== -->
<!-- Netzteil -->
<rect x="60" y="80" width="150" height="280" rx="10"/>
<!-- +24 V -> Sicherung -->
<line x1="210" y1="130" x2="270" y2="130"/>
<rect x="270" y="115" width="90" height="30"/>
<line x1="270" y1="130" x2="360" y2="130" stroke-width="1.5"/>
<line x1="360" y1="130" x2="480" y2="130"/>
<!-- Relaiskontakt COM -> NO -->
<circle cx="480" cy="130" r="5" fill="#111"/>
<line x1="480" y1="130" x2="560" y2="102"/>
<circle cx="580" cy="130" r="5" fill="#111"/>
<circle cx="580" cy="80" r="5"/>
<line x1="580" y1="130" x2="900" y2="130"/>
<!-- Laser -->
<rect x="900" y="80" width="230" height="300" rx="10"/>
<!-- Minus dick direkt -->
<line x1="210" y1="320" x2="900" y2="320" stroke-width="7"/>
<!-- mechanische Kopplung Spule -> Kontakt -->
<line x1="520" y1="118" x2="520" y2="468" stroke-dasharray="10 8" stroke-width="2"/>

<!-- Anet FAN -->
<rect x="60" y="440" width="270" height="220" rx="10"/>
<line x1="330" y1="490" x2="440" y2="490"/>
<line x1="440" y1="490" x2="480" y2="490"/>
<!-- Spule -->
<rect x="480" y="470" width="80" height="40" fill="#fff"/>
<line x1="480" y1="470" x2="560" y2="510" stroke-width="2"/>
<line x1="560" y1="490" x2="600" y2="490"/>
<!-- Diode parallel: Kathode (Ring) links an +24 V -->
<line x1="440" y1="490" x2="440" y2="580"/>
<line x1="600" y1="490" x2="600" y2="580"/>
<line x1="440" y1="580" x2="500" y2="580"/>
<line x1="540" y1="580" x2="600" y2="580"/>
<polygon points="540,560 540,600 502,580" fill="#111"/>
<line x1="500" y1="558" x2="500" y2="602" stroke-width="4"/>
<circle cx="440" cy="490" r="5" fill="#111"/>
<circle cx="600" cy="490" r="5" fill="#111"/>
<!-- FAN minus -->
<line x1="600" y1="580" x2="600" y2="630"/>
<line x1="600" y1="630" x2="330" y2="630"/>

<!-- ===== Teil B: Optokoppler ===== -->
<rect x="60" y="760" width="180" height="230" rx="10"/>
<!-- D11 -> R1 -->
<line x1="240" y1="810" x2="300" y2="810"/>
<rect x="300" y="795" width="90" height="30"/>
<line x1="390" y1="810" x2="470" y2="810"/>
<!-- GND -->
<line x1="240" y1="940" x2="470" y2="940"/>
<!-- Optokoppler-Gehaeuse -->
<rect x="470" y="760" width="230" height="230" stroke-dasharray="12 8" stroke-width="2"/>
<!-- LED -->
<line x1="470" y1="810" x2="550" y2="810"/>
<line x1="550" y1="810" x2="550" y2="850"/>
<polygon points="530,850 570,850 550,885" fill="#111"/>
<line x1="528" y1="887" x2="572" y2="887" stroke-width="4"/>
<line x1="550" y1="887" x2="550" y2="940"/>
<line x1="550" y1="940" x2="470" y2="940"/>
<!-- Lichtpfeile -->
<line x1="580" y1="860" x2="612" y2="860" stroke-width="2"/>
<polygon points="612,853 624,860 612,867" fill="#111" stroke-width="1"/>
<line x1="580" y1="885" x2="612" y2="885" stroke-width="2"/>
<polygon points="612,878 624,885 612,892" fill="#111" stroke-width="1"/>
<!-- Fototransistor -->
<line x1="635" y1="835" x2="635" y2="910" stroke-width="4"/>
<line x1="635" y1="855" x2="665" y2="825"/>
<line x1="665" y1="825" x2="665" y2="810"/>
<line x1="665" y1="810" x2="700" y2="810"/>
<line x1="635" y1="890" x2="665" y2="920"/>
<polygon points="666,921 652,918 662,907" fill="#111" stroke-width="1"/>
<line x1="665" y1="920" x2="665" y2="940"/>
<line x1="665" y1="940" x2="700" y2="940"/>

<!-- Pin 4 -> Teiler-Knoten -->
<line x1="700" y1="810" x2="1100" y2="810"/>
<line x1="1100" y1="810" x2="1100" y2="840"/>
<line x1="1100" y1="840" x2="1180" y2="840"/>
<circle cx="1180" cy="840" r="5" fill="#111"/>
<!-- Teiler senkrecht x=1180 -->
<line x1="1180" y1="720" x2="1180" y2="745"/>
<rect x="1165" y="745" width="30" height="70"/>
<line x1="1180" y1="815" x2="1180" y2="865"/>
<rect x="1165" y="865" width="30" height="70"/>
<line x1="1180" y1="935" x2="1180" y2="975"/>
<!-- C1 parallel zu R3 -->
<line x1="1180" y1="850" x2="1280" y2="850"/>
<line x1="1280" y1="850" x2="1280" y2="893"/>
<line x1="1258" y1="893" x2="1302" y2="893" stroke-width="4"/>
<line x1="1258" y1="905" x2="1302" y2="905" stroke-width="4"/>
<line x1="1280" y1="905" x2="1280" y2="960"/>
<line x1="1280" y1="960" x2="1180" y2="960"/>
<circle cx="1180" cy="960" r="5" fill="#111"/>
<!-- Masse-Symbol Teiler -->
<line x1="1160" y1="975" x2="1200" y2="975"/>
<line x1="1167" y1="983" x2="1193" y2="983"/>
<line x1="1174" y1="991" x2="1186" y2="991"/>

<!-- Pin 3 -> Laser PWM + R4 nach Laser-GND -->
<line x1="700" y1="940" x2="860" y2="940"/>
<circle cx="860" cy="940" r="5" fill="#111"/>
<line x1="860" y1="940" x2="930" y2="940"/>
<polygon points="930,932 946,940 930,948" fill="#111" stroke-width="1"/>
<line x1="860" y1="940" x2="860" y2="965"/>
<rect x="845" y="965" width="30" height="70"/>
<line x1="860" y1="1035" x2="860" y2="1055"/>
<line x1="840" y1="1055" x2="880" y2="1055"/>
<line x1="847" y1="1063" x2="873" y2="1063"/>
<line x1="854" y1="1071" x2="866" y2="1071"/>
</g>

<g fill="#111" font-size="22">
<text x="60" y="50" font-size="30" font-weight="bold">A  Laserversorgung (Relais)</text>
<text x="135" y="215" text-anchor="middle" font-weight="bold">Netzteil</text>
<text x="135" y="243" text-anchor="middle" font-weight="bold">24 V</text>
<text x="200" y="122" text-anchor="end">+</text>
<text x="200" y="312" text-anchor="end">−</text>
<text x="315" y="105" text-anchor="middle">F1  2 A träge</text>
<text x="470" y="160" text-anchor="end">COM</text>
<text x="595" y="160">NO</text>
<text x="595" y="74">NC (frei)</text>
<text x="625" y="230">K1 NAIS JS1-24V</text>
<text x="1015" y="190" text-anchor="middle" font-weight="bold">Lasermodul</text>
<text x="1015" y="218" text-anchor="middle">LT-80W-AA-PRO</text>
<text x="910" y="122">rot  +24 V</text>
<text x="910" y="312">schwarz  GND</text>
<text x="910" y="365" fill="#b0331a">gelb PWM ← siehe B</text>
<text x="715" y="352" text-anchor="middle" font-weight="bold">dick, direkt, ohne Schalter</text>
<text x="195" y="530" text-anchor="middle" font-weight="bold">Anet</text>
<text x="195" y="558" text-anchor="middle" font-weight="bold">FAN-Stecker</text>
<text x="320" y="482" text-anchor="end">+ 24 V fest</text>
<text x="320" y="622" text-anchor="end">− geschaltet</text>
<text x="615" y="466">Spule K1 (ca. 1,4 kΩ)</text>
<text x="520" y="545" text-anchor="middle">D1 1N4007</text>
<text x="660" y="530">D1: Ring zur +24-V-Seite</text>
<text x="660" y="562">Uno D13 → Pad „FAN“</text>
<text x="660" y="590">(Anet-MOSFET schaltet Spule)</text>
<text x="660" y="622">optional: Deckelschalter</text>
<text x="660" y="650">in Reihe zur Spule</text>

<text x="60" y="720" font-size="30" font-weight="bold">B  Lasersignal (Optokoppler)</text>
<text x="150" y="870" text-anchor="middle" font-weight="bold">Arduino</text>
<text x="150" y="898" text-anchor="middle" font-weight="bold">Uno</text>
<text x="230" y="802" text-anchor="end">D11</text>
<text x="230" y="932" text-anchor="end">GND</text>
<text x="345" y="785" text-anchor="middle">R1  470 Ω</text>
<text x="585" y="752" text-anchor="middle">U1  LTV-817 (PC817)</text>
<text x="482" y="802">1</text>
<text x="482" y="965">2</text>
<text x="680" y="802">4</text>
<text x="680" y="965">3</text>
<text x="1180" y="712" text-anchor="middle">Netzteil +24 V</text>
<text x="1210" y="788">R2  10 kΩ</text>
<text x="1150" y="880" text-anchor="end">R3  4,7 kΩ</text>
<text x="1310" y="905">C1 1 µF</text>
<text x="1205" y="1000">Netzteil −</text>
<text x="900" y="832">ca. 7,7 V</text>
<text x="955" y="948">Laser gelb</text>
<text x="955" y="976">(PWM)</text>
<text x="890" y="1005">R4  10 kΩ</text>
<text x="890" y="1075">Netzteil − (Laser-GND)</text>
<text x="60" y="1040" font-weight="bold" fill="#b0331a">Uno-GND und Netzteil-Minus</text>
<text x="60" y="1068" font-weight="bold" fill="#b0331a">NICHT verbinden!</text>
<text x="60" y="1100" font-size="18">LTV-817: Pin 1 = Punkt. D11 an = Laser-PWM ca. 5–7 V, aus/Reset = 0 V. C1 optional.</text>
</g>
</svg>
