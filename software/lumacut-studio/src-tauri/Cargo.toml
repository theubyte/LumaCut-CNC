[package]
name = "lumacut-studio"
version = "0.5.0"
description = "LumaCut CNC desktop design preview"
authors = ["LumaCut CNC"]
edition = "2021"

[lib]
name = "lumacut_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
