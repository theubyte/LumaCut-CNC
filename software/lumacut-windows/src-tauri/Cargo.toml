[package]
name = "lumacut-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lumacut_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
ttf-parser = "0.25"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
