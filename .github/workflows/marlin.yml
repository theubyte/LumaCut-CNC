name: LumaCut Marlin Firmware

# Compile on firmware-only changes (not on regular Pi/web commits).
# Manual builds remain available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/marlin/**'
      - '.github/workflows/marlin.yml'

permissions:
  contents: read

concurrency:
  group: lumacut-marlin-build
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/marlin/requirements.txt
      - name: Cache Marlin sources and PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/lumacut/upstreams
          key: ${{ runner.os }}-marlin-2.1.2.9-pio-6.2.0-v1
      - name: Install compiler
        run: pip install -r firmware/marlin/requirements.txt
      - name: Compile SKR Mini MZ firmware
        run: python firmware/marlin/build.py
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Marlin-${{ github.sha }}
          path: |
            firmware/marlin/dist/firmware.bin
            firmware/marlin/dist/manifest.json
          if-no-files-found: error
          retention-days: 14
