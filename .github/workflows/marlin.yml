name: LumaCut Marlin Experimental

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/marlin/**'
      - 'pi400/lumacut/marlin_**'
      - 'pi400/marlin/**'
      - 'tests/test_marlin_*'
      - '.github/workflows/marlin.yml'

jobs:
  marlin-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build Marlin
        run: python firmware/marlin/build.py
      - name: Upload STM32F103RC firmware and manifest
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Marlin-EXPERIMENTAL-${{ github.sha }}
          path: firmware/marlin/dist/
          if-no-files-found: error

  pi-marlin-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask pyserial
      - run: python -m compileall -q pi400/marlin pi400/lumacut
      - run: PYTHONPATH=pi400 python -m unittest discover -s tests -p "test_marlin_*.py" -v
