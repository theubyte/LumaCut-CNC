name: LumaCut Marlin Firmware

# Compile on firmware-only changes (not on regular Pi/web commits).
# Manual builds remain available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/marlin/**'
      - '.github/workflows/marlin.yml'

permissions:
  contents: read

concurrency:
  group: lumacut-marlin-build
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Release the images so the Pi offers them as an update (owner request 2026-10-31).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/marlin/requirements.txt
      - name: Cache Marlin sources and PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/lumacut/upstreams
          key: ${{ runner.os }}-marlin-2.1.2.9-pio-6.2.0-v1
      - name: Install compiler
        run: pip install -r firmware/marlin/requirements.txt
      - name: Compile SKR Mini MZ firmware
        run: python firmware/marlin/build.py
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Marlin-${{ github.sha }}
          path: |
            firmware/marlin/dist/firmware.bin
            firmware/marlin/dist/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Compile Anet V1.7 stand-in firmware (ATmega1284P)
        run: python firmware/marlin/build_anet.py
      - name: Upload Anet firmware
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Marlin-Anet-${{ github.sha }}
          path: |
            firmware/marlin/dist-anet/firmware.hex
            firmware/marlin/dist-anet/manifest.json
          if-no-files-found: error
          retention-days: 14
      # Never --latest: releases/latest stays the Android app. The Pi looks
      # for the newest marlin-* release (pi400/marlin/firmware_release.py),
      # checks hash, image and build stamp, and flashes only on the owner's
      # button press in the web UI.
      - name: Publish firmware release for the Pi
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: pi400
        run: |
          set -euo pipefail
          N=${{ github.run_number }}
          cp firmware/marlin/dist/firmware.bin LumaCut-Marlin-SKR.bin
          cp firmware/marlin/dist-anet/firmware.hex LumaCut-Marlin-Anet.hex
          python3 - "$N" <<'PY'
          import hashlib, json, os, sys
          from marlin.avr_flash import validate_hex
          from marlin.firmware_flash import validate_image
          boards = {}
          for board, asset, check in (("skr", "LumaCut-Marlin-SKR.bin", lambda d: validate_image(d)),
                                      ("anet", "LumaCut-Marlin-Anet.hex", lambda d: validate_hex(d.decode("ascii")))):
              data = open(asset, "rb").read()
              build = check(data)["build"]
              assert build, asset + ": no build stamp"
              boards[board] = {"asset": asset, "build": build, "size": len(data),
                               "sha256": hashlib.sha256(data).hexdigest()}
          json.dump({"number": int(sys.argv[1]), "commit": os.environ["GITHUB_SHA"], "boards": boards},
                    open("LumaCut-Marlin.json", "w"))
          PY
          cat LumaCut-Marlin.json
          gh release create "marlin-$N" LumaCut-Marlin.json LumaCut-Marlin-SKR.bin LumaCut-Marlin-Anet.hex \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "LumaCut Marlin Firmware $N" \
            --notes "Firmware-Build $N (${{ github.sha }}) für SKR Mini MZ und Anet V1.7. Der Pi meldet das Update in der Weboberfläche; geflasht wird erst per Knopfdruck."
