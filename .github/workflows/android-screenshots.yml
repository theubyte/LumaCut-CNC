name: LumaCut Android Screenshots
# Renders the app screens with Robolectric/Roborazzi (tablet, phone, light, dark) and
# keeps the PNGs as artifact and on the branch screenshots-<branch> for review.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile app (Fehler als Annotationen)
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --no-daemon -q 2>&1 | tee "$RUNNER_TEMP/compile.log"
          code=${PIPESTATUS[0]}
          grep -E '^e: ' "$RUNNER_TEMP/compile.log" | head -40 | while IFS= read -r l; do echo "::error::${l#*lumacut/app/}"; done
          exit $code
      - name: Render screens
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --tests '*ScreenshotTest*' --no-daemon --stacktrace > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          tail -60 "$RUNNER_TEMP/test.log"
          # Test failures as annotations (readable without downloading the logs).
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PYX'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  text = (fl.text or fl.get('message') or '').strip().splitlines()
                  print('::error::%s: %s' % (tc.get('name'), ' | '.join(l.strip() for l in text[:6])[:900]))
          PYX
          done
          grep -E '^e: ' "$RUNNER_TEMP/test.log" | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaCut-Screenshots
          path: |
            android/app/build/screenshots/
            android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30
      - name: Push PNGs to screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          src="$PWD/app/build/screenshots"
          [ -d "$src" ] || { echo "keine Screenshots"; exit 0; }
          dir="$RUNNER_TEMP/shots"; mkdir -p "$dir"; cp "$src"/*.png "$dir"/
          cd "$dir"
          echo "Screenshots von ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git init -q; git checkout -q -b shots; git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/screenshots-${GITHUB_REF_NAME//\//-}"
