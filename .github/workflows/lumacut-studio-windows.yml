name: Build LumaCut Studio Windows installer
on:
  workflow_dispatch:
  push:
    branches:
      - feature/lumacut-studio-initial
    paths:
      - 'software/lumacut-studio/**'
      - '.github/workflows/lumacut-studio-windows.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: software/lumacut-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software/lumacut-studio/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Generate Windows application icons
        run: npx tauri icon assets/icon.svg
      - name: Build Windows NSIS installer
        run: npm run build:windows
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Studio-Windows-Installer
          path: software/lumacut-studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
