name: Build LumaCut Studio Windows installer
on:
  workflow_dispatch:
  push:
    branches:
      - feature/lumacut-studio-initial
      - main
    paths:
      - 'software/lumacut-studio/**'
      - '.github/workflows/lumacut-studio-windows.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: software/lumacut-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software/lumacut-studio/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Verify JavaScript syntax and calibration geometry
        run: |
          node --check studio.js
          node --check advanced.js
          node --check job-planner.mjs
          node --check raster-planner.mjs
          node --check unified-job.mjs
          node --check marlin-postprocessor.mjs
          node --check calibrated-camera.js
          node --check camera-calibration-core.mjs
          npm run test:unit
      - name: Browser UI acceptance tests (Chrome/Edge)
        run: npm run test:ui
      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Studio-UI-Smoke
          path: software/lumacut-studio/test-artifacts/windows-ui.png
          if-no-files-found: ignore
      - name: Prepare frontend distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item index.html, studio.js, advanced.js, design.css, job-planner.mjs, raster-planner.mjs, unified-job.mjs, marlin-postprocessor.mjs, calibrated-camera.js, camera-calibration-core.mjs, geometry.mjs -Destination dist
      - name: Generate Windows application icons
        run: npx tauri icon assets/icon.svg
      - name: Build Windows NSIS installer
        run: npm run build:windows
      - name: Verify NSIS output exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -ErrorAction Stop)
          if ($files.Count -lt 1) { throw 'No Windows installer was generated' }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Studio-Windows-Installer
          path: software/lumacut-studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
