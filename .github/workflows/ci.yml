name: LumaCut source and firmware CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumacut-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile builder/app.py builder/flash_bundle.py builder/flash_local.py tools/probe_math.py firmware/skr/build.py
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [skr, hmi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO toolchains and packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.target }}-v2-${{ hashFiles('firmware/skr/platformio.ini', 'firmware/hmi/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: grblHAL SKR Mini MZ
        if: matrix.target == 'skr'
        run: |
          for attempt in 1 2 3; do
            if python firmware/skr/build.py && python firmware/skr/build.py --bridge; then exit 0; fi
            echo "Attempt $attempt failed, retrying after transient package/network issue."
            sleep 15
          done
          exit 1
      - name: Waveshare ESP32-S3 HMI (safe/offline and opt-in UART keypad)
        if: matrix.target == 'hmi'
        run: |
          for attempt in 1 2 3; do
            if pio run -d firmware/hmi -e lumacut_waveshare_s3 -e lumacut_waveshare_s3_keypad -e lumacut_waveshare_s3_pro; then exit 0; fi
            echo "Attempt $attempt failed, retrying after transient package/network issue."
            sleep 15
          done
          exit 1
      - name: Check full Waveshare flash bundles (offline and UART)
        if: matrix.target == 'hmi'
        run: |
          python -m pip install --disable-pip-version-check esptool==4.9.0
          PYTHONPATH=builder python - <<'PY'
          import os
          from pathlib import Path
          from flash_bundle import build_flash_package
          core = Path.home() / ".platformio"
          templates = Path("builder")
          for env in ("lumacut_waveshare_s3", "lumacut_waveshare_s3_keypad", "lumacut_waveshare_s3_pro"):
              output = Path("firmware/hmi/.pio/build") / env
              directory = Path("ci_flash_images") / env
              directory.mkdir(parents=True, exist_ok=True)
              files = build_flash_package(output, directory, "0" * 40, env, templates, core)
              print(env, files)
          PY
      - name: Save experimental binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-${{ matrix.target }}-${{ github.sha }}
          path: |
            firmware/skr/.pio/build/lumacut_skr_mz_usb/firmware.bin
            firmware/skr/.pio/build/lumacut_skr_mz_usb/firmware.elf
            firmware/skr/.pio/build/lumacut_skr_mz_hmi_uart/firmware.bin
            firmware/skr/.pio/build/lumacut_skr_mz_hmi_uart/firmware.elf
            firmware/hmi/.pio/build/lumacut_waveshare_s3/firmware.bin
            firmware/hmi/.pio/build/lumacut_waveshare_s3/firmware.elf
            firmware/hmi/.pio/build/lumacut_waveshare_s3_keypad/firmware.bin
            firmware/hmi/.pio/build/lumacut_waveshare_s3_keypad/firmware.elf
            firmware/hmi/.pio/build/lumacut_waveshare_s3_pro/firmware.bin
            firmware/hmi/.pio/build/lumacut_waveshare_s3_pro/firmware.elf
            ci_flash_images/lumacut_waveshare_s3_pro/LUMACUT_HMI_ESP32S3_MERGED.bin
            ci_flash_images/lumacut_waveshare_s3_pro/Waveshare-HMI-Flash-Paket-Windows.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  paired_release:
    name: Complete paired firmware ZIP
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: UNVERIFIED-*
          path: downloaded
      - name: Verify and package paired SKR and Waveshare
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root=pathlib.Path("downloaded")
          sha=os.environ["SOURCE_SHA"]
          skr=root/("UNVERIFIED-skr-"+sha)/"firmware"/"skr"/".pio"/"build"/"lumacut_skr_mz_hmi_uart"/"firmware.bin"
          image=root/("UNVERIFIED-hmi-"+sha)/"ci_flash_images"/"lumacut_waveshare_s3_pro"/"LUMACUT_HMI_ESP32S3_MERGED.bin"
          win=root/("UNVERIFIED-hmi-"+sha)/"ci_flash_images"/"lumacut_waveshare_s3_pro"/"Waveshare-HMI-Flash-Paket-Windows.zip"
          items={"SKR-Mini-MZ/firmware.bin":skr,"Waveshare/ESP32S3-Komplettimage.bin":image,"Waveshare/Waveshare-HMI-Flash-Paket-Windows.zip":win,"DOKUMENTATION/LUMACUT_CONTROL_OS.md":pathlib.Path("docs/LUMACUT_CONTROL_OS.md")}
          for name,path in items.items():
              if not path.is_file() or not path.stat().st_size: raise RuntimeError("Missing "+name+": "+str(path))
          manifest={"source_sha":sha,"hardware_validated":False,"items":{name:{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for name,p in items.items()}}
          with zipfile.ZipFile("LumaCut-Control-OS-Komplettpaket.zip","w",zipfile.ZIP_DEFLATED) as bundle:
              for name,p in items.items(): bundle.write(p,name)
              bundle.writestr("PRUEFSUMMEN.json",json.dumps(manifest,indent=2))
          print("Paired firmware package:",manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LUMACUT-KOMPLETT-${{ github.sha }}
          path: LumaCut-Control-OS-Komplettpaket.zip
          retention-days: 30
