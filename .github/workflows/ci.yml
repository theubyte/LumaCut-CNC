name: LumaCut source and firmware CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile builder/app.py tools/probe_math.py firmware/skr/build.py
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [skr, hmi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: grblHAL SKR Mini MZ
        if: matrix.target == 'skr'
        run: python firmware/skr/build.py
      - name: Waveshare ESP32-S3 HMI
        if: matrix.target == 'hmi'
        run: pio run -d firmware/hmi -e lumacut_waveshare_s3
      - name: Save experimental binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-${{ matrix.target }}-${{ github.sha }}
          path: |
            firmware/skr/.pio/build/lumacut_skr_mz_usb/firmware.bin
            firmware/skr/.pio/build/lumacut_skr_mz_usb/firmware.elf
            firmware/hmi/.pio/build/lumacut_waveshare_s3/firmware.bin
            firmware/hmi/.pio/build/lumacut_waveshare_s3/firmware.elf
          if-no-files-found: error
          retention-days: 30
