name: LumaCut source and firmware CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile builder/app.py builder/flash_bundle.py builder/flash_local.py tools/probe_math.py firmware/skr/build.py
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [skr, hmi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO toolchains and packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.target }}-v2-${{ hashFiles('firmware/skr/platformio.ini', 'firmware/hmi/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: grblHAL SKR Mini MZ
        if: matrix.target == 'skr'
        run: |
          for attempt in 1 2 3; do
            if python firmware/skr/build.py; then exit 0; fi
            echo "Attempt $attempt failed, retrying after transient package/network issue."
            sleep 15
          done
          exit 1
      - name: Waveshare ESP32-S3 HMI (safe/offline and opt-in UART keypad)
        if: matrix.target == 'hmi'
        run: |
          for attempt in 1 2 3; do
            if pio run -d firmware/hmi -e lumacut_waveshare_s3 -e lumacut_waveshare_s3_keypad; then exit 0; fi
            echo "Attempt $attempt failed, retrying after transient package/network issue."
            sleep 15
          done
          exit 1
      - name: Check full Waveshare flash bundles (offline and UART)
        if: matrix.target == 'hmi'
        run: |
          python -m pip install --disable-pip-version-check esptool==4.9.0
          PYTHONPATH=builder python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from flash_bundle import build_flash_package
          core = Path.home() / ".platformio"
          templates = Path("builder")
          for env in ("lumacut_waveshare_s3", "lumacut_waveshare_s3_keypad"):
              output = Path("firmware/hmi/.pio/build") / env
              with TemporaryDirectory() as directory:
                  files = build_flash_package(output, Path(directory), "0" * 40, env, templates, core)
                  print(env, files)
          PY
      - name: Save experimental binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-${{ matrix.target }}-${{ github.sha }}
          path: |
            firmware/skr/.pio/build/lumacut_skr_mz_usb/firmware.bin
            firmware/skr/.pio/build/lumacut_skr_mz_usb/firmware.elf
            firmware/hmi/.pio/build/lumacut_waveshare_s3/firmware.bin
            firmware/hmi/.pio/build/lumacut_waveshare_s3/firmware.elf
            firmware/hmi/.pio/build/lumacut_waveshare_s3_keypad/firmware.bin
            firmware/hmi/.pio/build/lumacut_waveshare_s3_keypad/firmware.elf
          if-no-files-found: error
          retention-days: 30
