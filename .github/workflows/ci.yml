name: LumaCut Pi 400 tests
# Pi gateway, firmware update path and installer checks. No real hardware.
on:
  push:
    paths:
      - 'pi400/**'
      - 'tests/**'
      - 'firmware/marlin/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumacut-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check Flask==3.1.1 pyserial==3.5
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Pi sources and check shell scripts
        run: |
          python -m compileall -q pi400 firmware/marlin
          bash -n pi400/install.sh pi400/update.sh pi400/recover.sh
