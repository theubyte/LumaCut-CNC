name: LumaCut Marlin Gateway Checks
on:
  push:
    paths:
      - 'pi400/marlin/**'
      - 'tests/test_marlin_gateway.py'
      - 'firmware/marlin/build.py'
      - '.github/workflows/marlin-gateway-tests.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install flask pyserial
      - name: Targeted integration tests
        run: python -m unittest discover -s tests -p 'test_marlin_gateway.py' -v
