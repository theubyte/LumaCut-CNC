name: LumaCut Studio Windows MSI
# Baut die MSI auf dem eigenen Zweig und prüft sie: Tests, Installation, Start, Screenshots, Deinstallation.
# Eine Vorabversion "windows-<version>" entsteht. Vorabversionen sieht /releases/latest des Pi nicht
# (Android-Update) und das Präfix passt nicht zur Firmware-Suche ("lumacut-fw-"), löst also kein
# Android-, Pi- oder Firmware-Update aus.
on:
  workflow_dispatch:
  push:
    branches: [windows-app]
    paths:
      - 'software/lumacut-windows/**'
      - '.github/workflows/lumacut-windows.yml'
permissions:
  contents: write
concurrency:
  group: lumacut-windows
  cancel-in-progress: true
jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: software/lumacut-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software/lumacut-windows/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: software/lumacut-windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Version aus Laufnummer
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          $f = 'src-tauri/tauri.conf.json'; $j = Get-Content $f -Raw | ConvertFrom-Json; $j.version = $v
          $j | ConvertTo-Json -Depth 20 | Set-Content $f -Encoding utf8
      - run: npm run typecheck
      - run: npm test
      - name: Screenshots gegen den Simulator
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          pip install -q flask pyserial
          node tools/e2e_all.mjs
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: software/lumacut-windows/tests/e2e/screenshots
          if-no-files-found: ignore
      - name: MSI bauen
        run: npx tauri build
      - name: MSI installieren, Praxistest im echten Fenster, deinstallieren
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "Installation scheiterte: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles\LumaCut Studio" -Filter *.exe | Where-Object Name -notlike 'unins*' | Select-Object -First 1
          if (-not $exe) { throw 'Programm nach der Installation nicht gefunden' }
          Start-Process python -ArgumentList 'tools/sim_pi.py','--port','8097' -WindowStyle Hidden
          Start-Sleep 6
          node tests/tauri/real.mjs $exe.FullName http://127.0.0.1:8097
          if ($LASTEXITCODE -ne 0) { throw 'Installierte App besteht den Praxistest nicht' }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deinstallation scheiterte: $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\LumaCut Studio\$($exe.Name)") { throw 'Programm nach Deinstallation noch vorhanden' }
      - name: Screenshots der installierten App hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installiert
          path: software/lumacut-windows/tests/e2e/screenshots/real
          if-no-files-found: ignore
      - name: Vorabversion veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'upload'; New-Item -ItemType Directory $dir | Out-Null
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          Copy-Item $msi.FullName "$dir/LumaCut-Studio.msi"
          $hash = (Get-FileHash "$dir/LumaCut-Studio.msi" -Algorithm SHA256).Hash.ToLower()
          @{ version = $env:VERSION; sha256 = $hash; size = (Get-Item "$dir/LumaCut-Studio.msi").Length; commit = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content "$dir/LumaCut-Studio.json" -Encoding ascii
          gh release create "windows-$env:VERSION" "$dir/LumaCut-Studio.msi" "$dir/LumaCut-Studio.json" --prerelease --latest=false --target $env:GITHUB_SHA --title "LumaCut Studio $env:VERSION" --notes "Windows-Vorabversion vom Zweig windows-app. Unsigniert: Windows SmartScreen warnt bei der Installation."
