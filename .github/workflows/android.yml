name: LumaCut Android APK
# Native tablet app (android/): core unit tests, then a signed release APK.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Release the signed APK so the Pi can fetch it (owner approved public releases, 2026-10-27).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key and version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/lumacut.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "LUMACUT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LUMACUT_SIGNED=1" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -storepass ci-temporary -keypass ci-temporary -alias lumacut \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LumaCut CI"
            echo "LUMACUT_KEYSTORE_PASSWORD=ci-temporary" >> "$GITHUB_ENV"
            echo "::warning::Kein Secret ANDROID_KEYSTORE_B64: APK mit Wegwerf-Schlüssel signiert, Updates erfordern Neuinstallation."
          fi
          echo "LUMACUT_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "LUMACUT_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Core unit tests
        run: gradle :core:test --no-daemon --stacktrace
      - name: Compile app (Fehler als Annotationen)
        shell: bash
        run: |
          set +e
          gradle :app:compileReleaseKotlin --no-daemon -q 2>&1 | tee "$RUNNER_TEMP/compile.log"
          code=${PIPESTATUS[0]}
          grep -E '^e: ' "$RUNNER_TEMP/compile.log" | head -40 | while IFS= read -r l; do echo "::error::${l#*lumacut/app/}"; done
          exit $code
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "LumaCut-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LumaCut-Android-APK
          path: android/LumaCut-*.apk
          if-no-files-found: error
          retention-days: 30
      # Only APKs signed with the fixed key are released: the Pi serves them as
      # updates, and Android installs an update only with the same key.
      - name: Publish GitHub release for the Pi
        if: env.LUMACUT_SIGNED == '1' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=${{ github.run_number }}
          test "$LUMACUT_VERSION_CODE" = "$N"
          cp "LumaCut-1.0.$N.apk" LumaCut-Android.apk
          python3 - "$N" <<'PY'
          import hashlib, json, os, sys
          n = int(sys.argv[1])
          data = open("LumaCut-Android.apk", "rb").read()
          json.dump({"version_code": n, "version_name": "1.0.%d" % n,
                     "sha256": hashlib.sha256(data).hexdigest(), "size": len(data),
                     "commit": os.environ["GITHUB_SHA"]}, open("LumaCut-Android.json", "w"))
          PY
          cat LumaCut-Android.json
          gh release create "android-1.0.$N" LumaCut-Android.apk LumaCut-Android.json \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "LumaCut Android 1.0.$N" \
            --notes "Signierte Android-App, Build $N (${{ github.sha }}). Der Pi holt sie automatisch; die App bietet das Update an."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/core/build/reports/
          if-no-files-found: ignore
