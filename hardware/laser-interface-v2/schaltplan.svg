<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Arial, Helvetica, sans-serif">
<rect width="1400" height="980" fill="#fff"/>
<g fill="#111" font-size="21">
<text x="40" y="44" font-size="30" font-weight="bold">LumaCut Laser-Interface V2 – Schaltplan</text>
<text x="40" y="74" font-size="18">Eine Platine: Laserversorgung über Relais + PWM über Optokoppler mit geregelten 5 V. Links SKR-Seite, rechts Laser-Seite.</text>
</g>
<!-- Trennlinie -->
<line x1="640" y1="100" x2="640" y2="950" stroke="#b0331a" stroke-width="3" stroke-dasharray="14 10"/>
<text x="652" y="945" fill="#b0331a" font-size="18" font-weight="bold">Trennung: kein Kupfer quer</text>

<g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- ===== A: Relais ===== -->
<!-- J4 SKR FAN1 -->
<rect x="40" y="150" width="150" height="150" rx="8"/>
<line x1="190" y1="180" x2="330" y2="180"/>
<line x1="190" y1="270" x2="330" y2="270"/>
<!-- D1 parallel -->
<line x1="260" y1="180" x2="260" y2="205"/>
<polygon points="240,245 280,245 260,210" fill="#111"/>
<line x1="240" y1="208" x2="280" y2="208" stroke-width="4"/>
<line x1="260" y1="245" x2="260" y2="270"/>
<circle cx="260" cy="180" r="5" fill="#111"/><circle cx="260" cy="270" r="5" fill="#111"/>
<!-- Spule -->
<line x1="330" y1="180" x2="330" y2="205"/>
<rect x="305" y="205" width="50" height="40" fill="#fff"/>
<line x1="305" y1="245" x2="355" y2="205" stroke-width="2"/>
<line x1="330" y1="245" x2="330" y2="270"/>
<!-- Wirklinie -->
<line x1="355" y1="225" x2="700" y2="225" stroke-dasharray="10 8" stroke-width="2"/>
<!-- J1 Netzteil -->
<rect x="1220" y="120" width="150" height="160" rx="8"/>
<line x1="1220" y1="150" x2="1110" y2="150"/>
<!-- F1 -->
<rect x="1010" y="135" width="100" height="30"/>
<line x1="1010" y1="150" x2="1110" y2="150" stroke-width="1.5"/>
<line x1="1010" y1="150" x2="760" y2="150"/>
<line x1="760" y1="150" x2="760" y2="190"/>
<!-- Kontakt COM-NO -->
<circle cx="760" cy="195" r="5" fill="#111"/>
<line x1="760" y1="195" x2="720" y2="262"/>
<circle cx="760" cy="270" r="5" fill="#111"/>
<circle cx="700" cy="270" r="5"/>
<line x1="760" y1="270" x2="760" y2="330"/>
<line x1="760" y1="330" x2="1220" y2="330"/>
<!-- J2 Laser -->
<rect x="1220" y="310" width="150" height="250" rx="8"/>
<!-- GND J1 -> J2 -->
<line x1="1220" y1="250" x2="1180" y2="250"/>
<line x1="1180" y1="250" x2="1180" y2="430"/>
<line x1="1180" y1="430" x2="1220" y2="430"/>
<!-- LED + R5 -->
<line x1="1080" y1="330" x2="1080" y2="370"/>
<rect x="1065" y="370" width="30" height="60"/>
<line x1="1080" y1="430" x2="1080" y2="455"/>
<polygon points="1062,458 1098,458 1080,488" fill="#111"/>
<line x1="1062" y1="490" x2="1098" y2="490" stroke-width="4"/>
<line x1="1080" y1="490" x2="1080" y2="520"/>
<line x1="1066" y1="520" x2="1094" y2="520"/><line x1="1071" y1="527" x2="1089" y2="527"/><line x1="1076" y1="534" x2="1084" y2="534"/>

<!-- ===== B: PWM ===== -->
<!-- J3 SKR BL_Touch -->
<rect x="40" y="600" width="150" height="150" rx="8"/>
<line x1="190" y1="630" x2="300" y2="630"/>
<rect x="300" y="615" width="90" height="30"/>
<line x1="390" y1="630" x2="520" y2="630"/>
<line x1="190" y1="720" x2="520" y2="720"/>
<!-- Optokoppler -->
<rect x="520" y="590" width="240" height="180" stroke-dasharray="12 8" stroke-width="2"/>
<line x1="520" y1="630" x2="580" y2="630"/><line x1="580" y1="630" x2="580" y2="655"/>
<polygon points="560,655 600,655 580,690" fill="#111"/>
<line x1="558" y1="692" x2="602" y2="692" stroke-width="4"/>
<line x1="580" y1="692" x2="580" y2="720"/><line x1="580" y1="720" x2="520" y2="720"/>
<line x1="610" y1="665" x2="640" y2="665" stroke-width="2"/><polygon points="640,658 652,665 640,672" fill="#111" stroke-width="1"/>
<line x1="610" y1="688" x2="640" y2="688" stroke-width="2"/><polygon points="640,681 652,688 640,695" fill="#111" stroke-width="1"/>
<line x1="665" y1="645" x2="665" y2="715" stroke-width="4"/>
<line x1="665" y1="662" x2="700" y2="635"/><line x1="700" y1="635" x2="700" y2="630"/><line x1="700" y1="630" x2="760" y2="630"/>
<line x1="665" y1="698" x2="700" y2="722"/><polygon points="701,723 688,720 696,710" fill="#111" stroke-width="1"/>
<line x1="700" y1="722" x2="700" y2="730"/><line x1="700" y1="730" x2="760" y2="730"/>
<!-- 5V Regler -->
<line x1="760" y1="330" x2="760" y2="330"/>
<line x1="900" y1="330" x2="900" y2="430"/>
<circle cx="900" cy="330" r="5" fill="#111"/>
<rect x="860" y="430" width="120" height="70" fill="#fff"/>
<line x1="980" y1="465" x2="1010" y2="465"/>
<line x1="920" y1="500" x2="920" y2="540"/>
<line x1="906" y1="540" x2="934" y2="540"/><line x1="911" y1="547" x2="929" y2="547"/><line x1="916" y1="554" x2="924" y2="554"/>
<!-- C1/C3 an Eingang -->
<line x1="840" y1="390" x2="900" y2="390"/><circle cx="900" cy="390" r="5" fill="#111"/>
<line x1="840" y1="390" x2="840" y2="410"/>
<line x1="822" y1="410" x2="858" y2="410" stroke-width="4"/><line x1="822" y1="420" x2="858" y2="420" stroke-width="4"/>
<line x1="840" y1="420" x2="840" y2="440"/>
<line x1="826" y1="440" x2="854" y2="440"/><line x1="831" y1="447" x2="849" y2="447"/><line x1="836" y1="454" x2="844" y2="454"/>
<!-- 5V Ausgang -> Kollektor -->
<line x1="1010" y1="465" x2="1010" y2="630"/>
<line x1="1010" y1="630" x2="760" y2="630"/>
<circle cx="1010" cy="560" r="5" fill="#111"/>
<line x1="1010" y1="560" x2="1050" y2="560"/>
<line x1="1050" y1="560" x2="1050" y2="575"/>
<line x1="1032" y1="575" x2="1068" y2="575" stroke-width="4"/><line x1="1032" y1="585" x2="1068" y2="585" stroke-width="4"/>
<line x1="1050" y1="585" x2="1050" y2="600"/>
<line x1="1036" y1="600" x2="1064" y2="600"/><line x1="1041" y1="607" x2="1059" y2="607"/><line x1="1046" y1="614" x2="1054" y2="614"/>
<!-- Emitter -> PWM -> J2 -->
<line x1="760" y1="730" x2="1150" y2="730"/>
<line x1="1150" y1="730" x2="1150" y2="520"/>
<line x1="1150" y1="520" x2="1220" y2="520"/>
<circle cx="900" cy="730" r="5" fill="#111"/>
<line x1="900" y1="730" x2="900" y2="760"/>
<rect x="885" y="760" width="30" height="70"/>
<line x1="900" y1="830" x2="900" y2="860"/>
<line x1="886" y1="860" x2="914" y2="860"/><line x1="891" y1="867" x2="909" y2="867"/><line x1="896" y1="874" x2="904" y2="874"/>
</g>

<g fill="#111" font-size="20">
<text x="40" y="128" font-size="26" font-weight="bold">A  Laserversorgung</text>
<text x="115" y="215" text-anchor="middle" font-weight="bold">J4</text>
<text x="115" y="240" text-anchor="middle">SKR FAN1</text>
<text x="180" y="174" text-anchor="end">+ (24 V)</text>
<text x="180" y="294" text-anchor="end">− (PC6)</text>
<text x="200" y="322">D1 1N4007</text>
<text x="368" y="200">K1 Spule</text>
<text x="368" y="268">G5LE-1 24 VDC</text>
<text x="1295" y="210" text-anchor="middle" font-weight="bold">J1 Netzteil</text>
<text x="1228" y="174">+24 V</text>
<text x="1228" y="244">GND</text>
<text x="1060" y="128" text-anchor="middle">F1  2 A träge</text>
<text x="772" y="196">COM</text>
<text x="772" y="292">NO</text>
<text x="700" y="304" text-anchor="middle">NC frei</text>
<text x="1295" y="478" text-anchor="middle" font-weight="bold">J2 Laser</text>
<text x="1228" y="354">rot +24 V</text>
<text x="1228" y="454">schwarz GND</text>
<text x="1228" y="544">gelb PWM</text>
<text x="1058" y="405" text-anchor="end">R5 4k7</text>
<text x="1102" y="480">LED1</text>

<text x="40" y="580" font-size="26" font-weight="bold">B  PWM-Signal</text>
<text x="115" y="665" text-anchor="middle" font-weight="bold">J3</text>
<text x="115" y="690" text-anchor="middle">SKR BL_Touch</text>
<text x="180" y="624" text-anchor="end">PA1</text>
<text x="180" y="744" text-anchor="end">GND</text>
<text x="345" y="605" text-anchor="middle">R1 680 Ω</text>
<text x="345" y="668" text-anchor="middle" font-size="16">(PC817: 470 Ω)</text>
<text x="640" y="582" text-anchor="middle">U1 SFH618A-3 / PC817</text>
<text x="532" y="624">1</text><text x="532" y="744">2</text><text x="742" y="624">4</text><text x="742" y="752">3</text>
<text x="920" y="460" text-anchor="middle" font-weight="bold">U2 7805</text>
<text x="920" y="485" text-anchor="middle" font-size="16">IN  GND  OUT</text>
<text x="888" y="372" text-anchor="end">C1 100n, C3 10µ</text>
<text x="1020" y="655">+5 V</text>
<text x="1072" y="598">C2 100n</text>
<text x="925" y="800">R4 2k2</text>
<text x="1000" y="755">PWM 0 / ~4,7 V</text>
<text x="40" y="820" font-size="18">• Laser-Minus (schwarz) und Netzteil-Minus sind eine Massefläche auf der Laser-Seite.</text>
<text x="40" y="848" font-size="18">• SKR-GND (J3) nur an Optokoppler Pin 2 – nie mit der Laser-Seite verbinden.</text>
<text x="40" y="876" font-size="18">• Relais aus ⇒ auch 7805 aus ⇒ kein PWM möglich. U2 = 7805 (TO-220), Pins IN-GND-OUT wie gedruckt.</text>
<text x="40" y="904" font-size="18">• Optionaler Deckelschalter: in Reihe in die FAN1-+-Leitung zu J4.</text>
</g>
</svg>
